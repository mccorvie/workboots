[project]
name = "tauceti-local-explore"
version = "0.1.0"
description = "Frozen, offline LeanExplore search service over Mathlib plus TauCeti at a pinned commit (workboots S3)."
requires-python = ">=3.12"
dependencies = [
    # Exact pin: PyPI release 1.3.0 (2026-08-02) == git 28eac03/6b25f86.
    # This release does NOT ship extract/prompt.txt, so we carry our own copy.
    "lean-explore[local]==1.3.0",
    # Floors: lean-explore only says sentence-transformers>=2.2.0, and uv will
    # happily walk back to 2022-era wheels (which then try to compile
    # tokenizers 0.10 from source). Qwen3-Embedding/Reranker need
    # transformers >= 4.51 anyway.
    "sentence-transformers>=5.0",
    "transformers>=4.51",
    "torch>=2.6",
    "huggingface_hub>=0.30",
]

[tool.uv]
package = false
